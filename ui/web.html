<!DOCTYPE html>
<html lang="en" data-theme="auto" data-palette="codex" data-day-palette="codex" data-night-palette="graphite" data-ui-style="default" data-style-palette-mode="saved">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/mizan.svg" type="image/svg+xml" />
    <title>Mizan · Bursa Shariah paper trading</title>
    <meta name="description" content="Practise trading Shariah-compliant Bursa Malaysia shares: SC Shariah list only, cash only, no short selling, with forecast ranges and a trade journal." />
    <meta name="color-scheme" content="light dark" />
    <style>body { overflow: auto; } #root { height: auto; }</style>
    <script>
      (function () {
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.palette = dark ? 'graphite' : 'codex';
      })();
    </script>
  </head>
  <body class="min-h-full bg-background text-foreground">
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="/src/mizan/web/main.tsx"></script>
  </body>
</html>
